defaults:
  - visualization: eval

num_workers: 0
batch_size: 1
cuda: 0
weight_name: "latest" # Used during resume, select with model to load from [miou, macc, acc..., latest]
enable_cudnn: True

# Directory containing <model_name>.pt. run_inference.sh fills this in
# (nibio_inference/modify_eval.py --checkpoint_dir); default is the repo's model_file/.
checkpoint_dir: "model_file"

model_name: PointGroup-PAPER
precompute_multi_scale: True # Compute multiscate features on cpu for faster training / inference
enable_dropout: False
voting_runs: 1
data:
  # fold: list of .ply files to predict (local coordinates, binary PLY with x,y,z).
  # Filled in by run_inference.sh via nibio_inference/modify_eval.py.
  fold: []
  # dataroot: where the dataset writes its processed cache (<dataroot>/treeinsfused/processed_<grid>_test/).
  # Overrides the dataroot stored in the checkpoint. Filled in by run_inference.sh; leave empty to use the checkpoint's.
  dataroot: ""


tracker_options: # Extra options for the tracker
  full_res: True
  make_submission: True
  ply_output: "maciej_eval.ply"
  save_viz: False   # True writes per-proposal and per-block debug PLYs into viz*/ (slow, lots of disk)

hydra:
  run:
    dir: ${checkpoint_dir}/eval/${now:%Y-%m-%d_%H-%M-%S}
